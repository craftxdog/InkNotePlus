name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Diagnose Ubuntu network access
        run: |
          ls -l /etc/resolv.conf
          cat /etc/resolv.conf
          for host in github.com registry.npmjs.org archive.ubuntu.com security.ubuntu.com; do
            printf '\nDNS %s (runner):\n' "$host"
            timeout 8 getent ahostsv4 "$host" || true
            printf 'DNS %s (_apt):\n' "$host"
            sudo -u _apt timeout 8 getent ahostsv4 "$host" || true
          done
          printf '\nHTTPS proxy environment present: %s\n' "${HTTPS_PROXY:+yes}"
          printf 'https_proxy environment present: %s\n' "${https_proxy:+yes}"
          curl --head --silent --show-error --connect-timeout 5 --max-time 10 https://archive.ubuntu.com/ubuntu/dists/noble/InRelease || true
          sudo curl --head --silent --show-error --connect-timeout 5 --max-time 10 https://archive.ubuntu.com/ubuntu/dists/noble/InRelease || true

      - name: Verify Ubuntu runtime dependencies
        run: bash scripts/setup-ubuntu-ci.sh runtime

      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Audit high and critical advisories
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Package application
        run: pnpm run build
