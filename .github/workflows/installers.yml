name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  make:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            os: macos-14
            command: pnpm run make:mac:arm64
            artifact: inknote-macos-arm64
          - name: macOS Intel DMG
            os: macos-15-intel
            command: pnpm run make:mac:x64
            artifact: inknote-macos-x64
          - name: Windows x64 Setup
            os: windows-2022
            command: pnpm run make:win:x64
            artifact: inknote-windows-x64
          - name: Linux x64 DEB and RPM
            os: ubuntu-24.04
            command: pnpm run make:linux:x64
            artifact: inknote-linux-x64

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Audit high and critical advisories
        run: pnpm audit --audit-level high

      - name: Verify source
        run: pnpm run verify

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14
