name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Match the pushed tag to package.json
        run: node scripts/release.mjs check

  make:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            os: macos-15
            command: pnpm run make:mac:arm64
            arch: arm64
            platform: darwin
            artifact: inknote-macos-arm64
          - name: macOS Intel DMG
            os: macos-15-intel
            command: pnpm run make:mac:x64
            arch: x64
            platform: darwin
            artifact: inknote-macos-x64
          - name: Windows x64 Setup
            os: windows-2022
            command: pnpm run make:win:x64
            arch: x64
            platform: win32
            artifact: inknote-windows-x64
          - name: Linux x64 DEB and RPM
            os: ubuntu-24.04
            command: pnpm run make:linux:x64
            arch: x64
            platform: linux
            artifact: inknote-linux-x64

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: bash scripts/setup-ubuntu-ci.sh packaging

      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Audit high and critical advisories
        run: pnpm audit --audit-level high

      - name: Verify source
        run: pnpm run verify

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Install and launch macOS DMG
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-installer.mjs ${{ matrix.arch }} --smoke

      - name: Install and launch Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content package.json | ConvertFrom-Json
          $installers = @(Get-ChildItem out/make -Recurse -Filter '*Setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Setup.exe' }
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList '--silent' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed: $($setup.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "$($metadata.name)/app-$($metadata.version)/$($metadata.productName).exe"
          if (!(Test-Path $installed)) { throw "Installed executable missing: $installed" }
          # Squirrel launches once after installation; test a fresh, isolated profile.
          Get-Process | Where-Object { $_.Path -eq $installed } | Stop-Process -Force
          node scripts/smoke-electron.mjs "--app-path=$installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-windows-icons.ps1 -InstalledExe $installed -SetupExe $installers[0].FullName

      - name: Install and launch Debian package
        if: runner.os == 'Linux'
        run: |
          mapfile -t packages < <(find out/make/deb -name '*.deb')
          test "${#packages[@]}" -eq 1
          sudo apt-get --config-file "$INKNOTE_APT_CONFIG" install --yes "./${packages[0]}"
          dpkg-query --show --showformat='${Status}\n' inknote | grep -Fx 'install ok installed'
          xvfb-run -a node scripts/smoke-electron.mjs --app-path=/usr/bin/inknote
          cmp assets/icons/512x512.png /usr/share/pixmaps/inknote.png
          cmp assets/icon.png /usr/lib/inknote/resources/icon.png
          grep -Fx 'Icon=inknote' /usr/share/applications/inknote.desktop

      - name: Install and launch RPM on Fedora
        if: runner.os == 'Linux'
        run: |
          # Chromium creates its own sandbox namespaces inside this disposable container.
          docker run --rm --init --shm-size=1g --cap-add=SYS_ADMIN --env CI=true \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            fedora:44 bash scripts/verify-rpm-installer.sh

      - name: Extended desktop QA
        if: runner.os != 'Linux'
        run: pnpm run test:desktop:qa --extended-only

      - name: Extended desktop QA on Linux
        if: runner.os == 'Linux'
        run: |
          # The test entry uses the same Electron version as the installed app.
          # Configure its actual helper; recent Chromium ignores the old
          # CHROME_DEVEL_SANDBOX override. Keep the renderer sandbox enabled.
          node -e "require('electron')"
          sandbox_helper=$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")
          sudo install --owner=root --group=root --mode=4755 /usr/lib/inknote/chrome-sandbox "$sandbox_helper"
          xvfb-run -a node scripts/smoke-qa.mjs --extended-only

      - name: Upload QA results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/qa/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare versioned public downloads
        run: node scripts/release.mjs stage ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Upload tested installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 14
