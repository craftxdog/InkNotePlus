name: Build portable archives

# Runs after a release is published, so a failure here never blocks the installers.
on:
  workflow_run:
    workflows: ['Publish release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, such as v1.4.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Find the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon ZIP
            os: macos-15
            command: node scripts/make-portable.mjs darwin arm64
            artifact: portable-macos-arm64
          - name: macOS Intel ZIP
            os: macos-15-intel
            command: node scripts/make-portable.mjs darwin x64
            artifact: portable-macos-x64
          - name: Windows x64 ZIP
            os: windows-2022
            command: node scripts/make-portable.mjs win32 x64
            artifact: portable-windows-x64
          - name: Windows ARM64 ZIP
            os: windows-11-arm
            command: node scripts/make-portable.mjs win32 arm64
            artifact: portable-windows-arm64
          - name: Linux x64 ZIP
            os: ubuntu-24.04
            command: node scripts/make-portable.mjs linux x64
            artifact: portable-linux-x64
          - name: Linux ARM64 ZIP
            os: ubuntu-24.04-arm
            command: node scripts/make-portable.mjs linux arm64
            artifact: portable-linux-arm64
    steps:
      - name: Check out the release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Build archive
        run: ${{ matrix.command }}

      - name: Keep the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: out/portable/*
          if-no-files-found: error

  upload:
    needs: [resolve, build]
    name: Attach archives to the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: portable-*
          merge-multiple: true
          path: portable

      # This job only uploads files and never runs code from the repository.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" portable/* --clobber --repo "$GITHUB_REPOSITORY"
