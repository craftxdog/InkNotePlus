name: Publish release

on:
  workflow_run:
    workflows: ['Build installers']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Completed tag build with all four native installer checks passed'
        required: true
        type: string
      draft_release_id:
        description: 'Optional numeric ID of a draft to recover'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.id || inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
    name: Publish verified downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
      RELEASE_DRAFT_ID: ${{ inputs.draft_release_id }}
    steps:
      - name: Check out trusted publication tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1

      - name: Verify the source build and every native installer check
        run: node scripts/release.mjs verify-build

      - name: Download only the verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RELEASE_BUILD_RUN_ID }}
          pattern: inknote-*
          merge-multiple: true
          path: ${{ runner.temp }}/inknote-release

      - name: Verify files, upload and publish
        env:
          RELEASE_ASSET_DIR: ${{ runner.temp }}/inknote-release
        run: node scripts/release.mjs publish
