; Ajustes de CouchDB para InkNote. Los secretos llegan desde .env.
[couchdb]
single_node = true
; InkNote nunca envía documentos mayores que este valor.
max_document_size = 8000000

[chttpd]
; Toda la API exige usuario. /_up queda libre para la comprobación de salud.
require_valid_user_except_for_up = true
enable_cors = false

[chttpd_auth]
; Las sesiones por cookie caducan pronto. InkNote usa autenticación básica.
timeout = 3600
allow_persistent_cookies = false

[log]
level = warning
