nodeLinker: hoisted

# micromark's optional HTML renderer only calls renderToString. Keep it on the
# same reviewed KaTeX as the host renderer instead of the vulnerable 0.16 copy
# (GHSA-238p-pmpm-9mq7); math parsing and rendered output are covered by tests.
overrides:
  'micromark-extension-math>katex': '0.19.0'
  # Keep the packager on patched glob APIs. Older callback-based glob 7 stays
  # outside these overrides. Both fixes are verified by packaged-app tests.
  # https://github.com/advisories/GHSA-3g3m-2fjr-6pw4
  # https://github.com/advisories/GHSA-g3hv-75wg-m249
  '@electron/asar@4.3.1>glob': '14.0.2'
  '@electron/asar@4.3.1>minimatch': '11.0.1'

packages:
  - 'themes/*'

allowBuilds:
  electron: true
  electron-winstaller: true
  puppeteer: true
